<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#020408"/>
  <!-- Antenna stem -->
  <line x1="16" y1="3.5" x2="16" y2="8.5" stroke="#00f5ff" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Antenna tip -->
  <circle cx="16" cy="2.5" r="1.8" fill="#00f5ff"/>
  <!-- Head body -->
  <rect x="6.5" y="8.5" width="19" height="16" rx="3" fill="#0a1628" stroke="#00f5ff" stroke-width="1.2"/>
  <!-- Left eye -->
  <rect x="9.5" y="13.5" width="4.5" height="3" rx="1" fill="#00f5ff"/>
  <!-- Right eye -->
  <rect x="18" y="13.5" width="4.5" height="3" rx="1" fill="#00f5ff"/>
  <!-- Mouth -->
  <rect x="11" y="20" width="10" height="1.8" rx="0.9" fill="#00f5ff" opacity="0.65"/>
</svg>
